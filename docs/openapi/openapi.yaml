  /inbound/v1/{partner_slug}/events:
    post:
      tags:
      - inbound
      summary: Ingest partner webhook event
      description: Accepts a partner webhook. Sign the raw body with HMAC-SHA256 over
        `{X-Hub-Timestamp}.{raw_body}` and send the hex digest in `X-Hub-Signature-256`
        (optional `sha256=` prefix). First unique `Idempotency-Key` returns **202**;
        the same key returns **200** with the original `event_id`. Path `{partner_slug}`
        is lowercase kebab-case. JSON `event_id` is a UUIDv7 public identifier.
      operationId: ingest_event_inbound_v1__partner_slug__events_post
      parameters:
      - name: partner_slug
        in: path
        required: true
        schema:
          type: string
          description: Partner slug identifier (lowercase kebab-case).
          title: Partner Slug
        description: Partner slug identifier (lowercase kebab-case).
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bearer partner API key with `inbound:write`. Missing or invalid
            returns 401.
          title: Authorization
        description: Bearer partner API key with `inbound:write`. Missing or invalid
          returns 401.
      - name: X-Hub-Signature-256
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Required HMAC-SHA256 hex digest of `{timestamp}.{raw_body}`
            using the partner signing secret. Optional `sha256=` prefix. Missing or
            invalid returns 403.
          title: X-Hub-Signature-256
        description: Required HMAC-SHA256 hex digest of `{timestamp}.{raw_body}` using
          the partner signing secret. Optional `sha256=` prefix. Missing or invalid
          returns 403.
      - name: X-Hub-Timestamp
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Required Unix timestamp (seconds) used in the HMAC payload.
            Skew beyond the configured tolerance returns 403.
          title: X-Hub-Timestamp
        description: Required Unix timestamp (seconds) used in the HMAC payload. Skew
          beyond the configured tolerance returns 403.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Required. First accept is 202; repeating the same key returns
            200 with the original event_id. Missing or blank returns 422.
          title: Idempotency-Key
        description: Required. First accept is 202; repeating the same key returns
          200 with the original event_id. Missing or blank returns 422.
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundEventAcceptedResponse'
        '200':
          description: Duplicate Idempotency-Key; same event_id returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundEventDuplicateResponse'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundErrorResponse'
        '403':
          description: Invalid HMAC signature or timestamp skew.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundErrorResponse'
        '404':
          description: Partner not found or inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundErrorResponse'
        '409':
          description: Idempotency key conflict while persisting; safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundErrorResponse'
        '413':
          description: Request body exceeds the 256 KB payload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundErrorResponse'
        '422':
          description: Invalid event schema or event type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundErrorResponse'
        '429':
          description: Partner rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: JSON body for inbound webhook POST.
              properties:
                event_type:
                  description: Event type (e.g. order.created).
                  title: Event Type
                  type: string
                payload:
                  additionalProperties: true
                  description: Opaque event payload from partner.
                  title: Payload
                  type: object
              required:
              - event_type
              - payload
              title: InboundEventBody
              type: object
            examples:
              happy:
                summary: Accepted order.created webhook
                value:
                  event_type: order.created
                  payload:
                    order_id: ord_123
                    amount: 99.99
              bad_timestamp:
                summary: Valid body; timestamp skew rejected with 403
                description: Use X-Hub-Timestamp more than 300 seconds from server
                  time.
                value:
                  event_type: order.created
                  payload:
                    order_id: ord_456
  /internal/v1/outbound/events:
    post:
      tags:
      - internal
      summary: Enqueue outbound partner webhook delivery
      description: Platform-only enqueue. `partner_id` is the partner public UUIDv7.
        Creates one delivery per matching active endpoint. First unique `idempotency_key`
        returns **202**; the same key returns **200** with the original `delivery_ids`.
        Not partner-facing.
      operationId: create_outbound_event_internal_v1_outbound_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundEventRequest'
            examples:
              order_created:
                summary: Enqueue order.created for partner delivery
                value:
                  partner_id: 0194a2b3-c4d5-7890-abcd-ef1234567890
                  event_type: order.created
                  payload:
                    order_id: ord_123
                    amount: 99.99
                  idempotency_key: idem-order-created-1
                  correlation_id: 0194a2b3-c4d5-7890-abcd-ef1234567891
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundEventAcceptedResponse'
        '200':
          description: Duplicate idempotency_key; same delivery_ids returned without
            republish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundEventDuplicateResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundErrorResponse'
        '403':
          description: Caller role is not allowed to enqueue outbound deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundErrorResponse'
        '409':
          description: Idempotency key conflict while persisting; safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundErrorResponse'
        '422':
          description: Inactive partner, unsupported event type, or invalid correlation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundErrorResponse'
      security:
      - HTTPBearer: []
  /partner/v1/deliveries/{delivery_id}:
    get:
      tags:
      - partner
      summary: Get delivery status
      description: Read-only status for a delivery owned by the authenticated partner.
        `delivery_id` is the public UUIDv7. Webhook payload is never returned. Another
        partner's delivery returns **404**.
      operationId: get_delivery_status_partner_v1_deliveries__delivery_id__get
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Delivery public UUIDv7 identifier.
          title: Delivery Id
        description: Delivery public UUIDv7 identifier.
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bearer partner API key with `status:read`. Missing or invalid
            returns 401; wrong scope returns 403.
          title: Authorization
        description: Bearer partner API key with `status:read`. Missing or invalid
          returns 401; wrong scope returns 403.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerDeliveryStatusResponse'
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerErrorResponse'
        '403':
          description: API key lacks status:read scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerErrorResponse'
        '404':
          description: Delivery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AdminErrorResponse:
