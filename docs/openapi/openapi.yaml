tags:
- name: inbound
  description: Partner-facing webhook ingest. HMAC-SHA256 over timestamp and raw body;
    API key in Authorization.
- name: admin
  description: Operator API. Identifiers are UUIDv7 public ids only. Replay requires
    reason and is audited.
- name: internal
  description: Platform services only. Not partner-facing. partner_id is the partner
    public UUID.
- name: partner
  description: Partner read-only APIs for own deliveries only; not admin.
- name: health
  description: Liveness and readiness probes.
