    PartnerAnalyticsSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Partner public UUIDv7 identifier.
          examples:
          - 0194a2b3-c4d5-7890-abcd-ef1234567890
        slug:
          type: string
          title: Slug
          description: Partner slug (URL-safe identifier).
          examples:
          - acme-erp
        window_hours:
          type: integer
          title: Window Hours
          description: Rolling analytics window length in hours.
          examples:
          - 24
        success_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Success Rate
          description: Delivered divided by terminal deliveries (delivered + failed)
            in the window; null when there are no terminal rows.
          examples:
          - 0.92
        p95_latency_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: P95 Latency Ms
          description: 95th percentile of delivery attempt durations in the window
            (nearest-rank); null when no timed attempts exist.
          examples:
          - 245
        sla_compliance_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Sla Compliance Pct
          description: Percentage of terminal deliveries without SLA breach in the
            window; null when there are no terminal rows.
          examples:
          - 98.5
        sla_breaches:
          type: integer
          minimum: 0.0
          title: Sla Breaches
          description: Count of terminal deliveries with sla_breached=true in the
            window.
          examples:
          - 2
        circuit_state:
          $ref: '#/components/schemas/AnalyticsCircuitState'
          description: Redis circuit breaker state; unknown when Redis is unavailable.
          examples:
          - closed
        dlq_age_seconds:
          type: integer
          minimum: 0.0
          title: Dlq Age Seconds
          description: Age in seconds of the oldest unacknowledged dead-letter for
            this partner; 0 when none.
          examples:
          - 3600
      type: object
      required:
      - id
      - slug
      - window_hours
      - success_rate
      - p95_latency_ms
      - sla_compliance_pct
      - sla_breaches
      - circuit_state
      - dlq_age_seconds
      title: PartnerAnalyticsSummary
      description: 24-hour partner delivery compliance summary.
