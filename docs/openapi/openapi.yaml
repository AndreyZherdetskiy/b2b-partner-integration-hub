      required:
      - delivery_ids
      - reason
      title: BulkReplayRequest
      description: Body for POST /admin/v1/deliveries/bulk-replay.
    BulkReplayResponse:
      properties:
        requested:
          items:
            type: string
            format: uuid
          type: array
          title: Requested
