      - key_prefix
      - scopes
      - created_at
      title: ApiKeyCreatedResponse
      description: API key creation response — plaintext key shown once.
    BulkReplayRequest:
      properties:
        delivery_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 100
          minItems: 1
