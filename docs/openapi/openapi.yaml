openapi: 3.1.0
info:
  title: Partner Integration Hub
  summary: At-least-once B2B webhook delivery with HMAC, retries, DLQ, and audited
    replay.
  description: Inbound uses HMAC-SHA256 (`X-Hub-Signature-256`) over `{timestamp}.{raw_body}`
    and Bearer API keys. First accept returns **202**; duplicate Idempotency-Key returns
    **200**. JSON `id` fields are UUIDv7 public identifiers, never sequential database
    keys. Correlation `X-Correlation-Id` is UUIDv7. Internal outbound is tagged `internal`
    and is not partner-facing.
  version: 0.1.0
servers:
- url: http://localhost:8000
  description: Local Compose
paths:
  /inbound/v1/health:
    get:
      tags:
      - health
      summary: Inbound liveness probe
      description: Process liveness for the inbound listener. No authentication.
      operationId: inbound_health_inbound_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '422':
          description: Invalid X-Correlation-Id (must be UUID version 7).
  /internal/v1/health:
    get:
      tags:
      - health
      summary: Internal liveness probe
      description: Process liveness for internal platform callers. No authentication.
      operationId: internal_health_internal_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '422':
          description: Invalid X-Correlation-Id (must be UUID version 7).
  /admin/v1/partners:
    post:
      tags:
      - admin
      summary: Create partner
      description: Provisions a partner and returns the HMAC signing secret once.
        `id` in the response is the public UUIDv7, never the sequential database key.
      operationId: create_partner_admin_v1_partners_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreate'
            examples:
              acme:
                summary: Provision a new partner
                description: Creates a partner and returns the signing secret once.
                value:
                  slug: acme-erp
                  name: ACME ERP
                  sla_seconds: 60
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCreatedResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
    get:
      tags:
      - admin
      summary: List partners
      description: Paginated partner directory. Identifiers are public UUIDv7 values.
      operationId: list_partners_admin_v1_partners_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Maximum number of items to return (default 50, max 200).
          default: 50
          title: Limit
        description: Maximum number of items to return (default 50, max 200).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip before returning results.
          default: 0
          title: Offset
        description: Number of items to skip before returning results.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPartnersResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/partners/{id}:
    get:
      tags:
      - admin
      summary: Get partner
      description: Returns partner configuration by public UUIDv7. Signing secrets
        are never included.
      operationId: get_partner_admin_v1_partners__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Partner public UUIDv7 identifier.
          title: Id
        description: Partner public UUIDv7 identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
    patch:
      tags:
      - admin
      summary: Update partner
      description: Partial update of status, SLA, rate limit, auto-replay, or circuit-breaker
        config.
      operationId: update_partner_admin_v1_partners__id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Partner public UUIDv7 identifier.
          title: Id
        description: Partner public UUIDv7 identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUpdate'
            examples:
              activate:
                summary: Mark partner active
                value:
                  status: active
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/partners/{id}/api-keys:
    post:
      tags:
      - admin
      summary: Create API key
      description: 'Issues a partner API key. The full key is returned once; store
        it out-of-band. Typical scopes: `inbound:write`, `status:read`.'
      operationId: create_api_key_admin_v1_partners__id__api_keys_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Partner public UUIDv7 identifier.
          title: Id
        description: Partner public UUIDv7 identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
            examples:
              inbound_write:
                summary: Inbound write key
                value:
                  scopes:
                  - inbound:write
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/partners/{id}/rotate-secret:
    post:
      tags:
      - admin
      summary: Rotate partner signing secret
      description: Rotates the partner HMAC signing secret with an overlap window
        (`hub_secret_rotation_overlap_hours`, default 24h). The previous secret remains
        valid for inbound verification until `valid_until`. Returns the new plaintext
        secret once.
      operationId: rotate_signing_secret_admin_v1_partners__id__rotate_secret_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Partner public UUIDv7 identifier.
          title: Id
        description: Partner public UUIDv7 identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/analytics/partners/{id}/summary:
    get:
      tags:
      - admin
      summary: Partner analytics summary
      description: Rolling 24-hour delivery compliance metrics from PostgreSQL (success
        rate, p95 latency, SLA compliance, circuit state, DLQ age).
      operationId: get_partner_analytics_summary_admin_v1_analytics_partners__id__summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Partner public UUIDv7 identifier.
          title: Id
        description: Partner public UUIDv7 identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAnalyticsSummary'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/analytics/overview:
    get:
      tags:
      - admin
      summary: Fleet analytics overview
      description: 'Rolling 24-hour fleet snapshot: DLQ backlog, average SLA compliance,
        and top failing partners by success rate.'
      operationId: get_analytics_overview_admin_v1_analytics_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
      security:
      - HTTPBearer: []
  /admin/v1/analytics/compliance-export:
    get:
      tags:
      - admin
      summary: Weekly SLA compliance export
      description: 'Export per-partner success rate, SLA compliance, breaches, and
        DLQ counts for a custom ISO-8601 time window. Default response is CSV; send
        Accept: application/json for a structured payload.'
      operationId: get_compliance_export_admin_v1_analytics_compliance_export_get
      security:
      - HTTPBearer: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inclusive window start (ISO 8601).
          title: From
        description: Inclusive window start (ISO 8601).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inclusive window end (ISO 8601).
          title: To
        description: Inclusive window end (ISO 8601).
      - name: accept
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: text/csv (default) or application/json.
          title: Accept
        description: text/csv (default) or application/json.
      responses:
        '200':
          description: Compliance export for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceExportResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Partner not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/deliveries:
    get:
      tags:
      - admin
      summary: List deliveries
      description: Paginated delivery list. Path and `partner_id` filters use public
        UUIDv7 identifiers. Payload may be present on detail views only according
        to the response model.
      operationId: list_deliveries_admin_v1_deliveries_get
      security:
      - HTTPBearer: []
      parameters:
      - name: partner_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter by partner public UUIDv7 identifier.
          title: Partner Id
        description: Filter by partner public UUIDv7 identifier.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DeliveryStatus'
          - type: 'null'
          description: Filter by delivery status.
          title: Status
        description: Filter by delivery status.
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by event type.
          title: Event Type
        description: Filter by event type.
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive lower bound on created_at (ISO 8601).
          title: From
        description: Inclusive lower bound on created_at (ISO 8601).
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Inclusive upper bound on created_at (ISO 8601).
          title: To
        description: Inclusive upper bound on created_at (ISO 8601).
      - name: correlation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by correlation identifier.
          title: Correlation Id
        description: Filter by correlation identifier.
      - name: sla_breached
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by SLA breach flag.
          title: Sla Breached
        description: Filter by SLA breach flag.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Maximum number of items to return (default 50, max 200).
          default: 50
          title: Limit
        description: Maximum number of items to return (default 50, max 200).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip before returning results.
          default: 0
          title: Offset
        description: Number of items to skip before returning results.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeliveriesResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Delivery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '409':
          description: Delivery status does not allow replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/deliveries/bulk-replay:
    post:
      tags:
      - admin
      summary: Bulk replay failed deliveries
      description: Admin-only replay of up to 100 failed deliveries. `reason` is required
        and audited. Open circuits and rate limits skip individual ids instead of
        failing the batch.
      operationId: bulk_replay_deliveries_endpoint_admin_v1_deliveries_bulk_replay_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkReplayRequest'
            examples:
              incident_recovery:
                summary: Bulk replay after partner outage
                description: Admin-only bulk replay with audit reason; respects circuit
                  breaker and rate limits.
                value:
                  delivery_ids:
                  - 0194a2b3-c4d5-7890-abcd-ef1234567890
                  reason: Partner endpoint restored after regional outage.
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReplayResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Delivery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '409':
          description: Delivery status does not allow replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
      security:
      - HTTPBearer: []
  /admin/v1/deliveries/test:
    post:
      tags:
      - admin
      summary: Enqueue sandbox test delivery
      description: Admin-only test send against a partner endpoint (typically partner-mock).
        Uses the same persist path as internal outbound; `partner_id` is a public
        UUIDv7.
      operationId: sandbox_test_delivery_admin_v1_deliveries_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxTestDeliveryRequest'
            examples:
              order_created:
                summary: Sandbox order.created for partner delivery
                value:
                  partner_id: 0194a2b3-c4d5-7890-abcd-ef1234567890
                  event_type: order.created
                  payload:
                    order_id: ord_sandbox_1
                    amount: 42.0
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundEventAcceptedResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Delivery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '409':
          description: Delivery status does not allow replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '200':
          description: Duplicate idempotency_key; same delivery_ids returned without
            republish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundEventDuplicateResponse'
      security:
      - HTTPBearer: []
  /admin/v1/deliveries/{id}:
    get:
      tags:
      - admin
      summary: Get delivery with attempts
      description: Delivery detail by public UUIDv7, including nested attempts. Replay
        does not mutate the stored payload.
      operationId: get_delivery_admin_v1_deliveries__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Delivery public UUIDv7 identifier.
          title: Id
        description: Delivery public UUIDv7 identifier.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '401':
          description: Missing or invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '403':
          description: Insufficient role for this operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '404':
          description: Delivery not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '409':
          description: Delivery status does not allow replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminErrorResponse'
  /admin/v1/deliveries/{id}/attempts:
    get:
      tags:
      - admin
      summary: List delivery attempts
      description: Paginated HTTP attempt history for a delivery public UUIDv7.
      operationId: list_delivery_attempts_admin_v1_deliveries__id__attempts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Delivery public UUIDv7 identifier.
          title: Id
        description: Delivery public UUIDv7 identifier.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Maximum number of items to return (default 50, max 200).
          default: 50
          title: Limit
        description: Maximum number of items to return (default 50, max 200).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip before returning results.
          default: 0
          title: Offset
        description: Number of items to skip before returning results.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptsResponse'
        '401':
